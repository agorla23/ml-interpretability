[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-interpretability"
version = "0.1.0"
description = "Evidence-backed, LLM-assisted analysis of tabular machine-learning datasets"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_benchmark_data(*paths): requires local gitignored benchmark CSVs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701"]
